<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ JHALAK — your moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f0d0b;
  --surface:  #1a1614;
  --oat:      #f2ede6;
  --rose:     #c8697a;
  --text:     #e8e0d5;
  --muted:    #7a6e68;
  --border:   #2e2a28;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'VT323', 'Courier New', monospace;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 20px 48px;
  gap: 0;
}

.header {
  width: 100%;
  max-width: 500px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.wordmark {
  font-size: 28px;
  letter-spacing: 8px;
  color: var(--text);
}

.tagline {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.photo-frame {
  width: 100%;
  max-width: 500px;
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
}

.photo-frame img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.photo-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 16px;
  letter-spacing: 2px;
}

.actions {
  width: 100%;
  max-width: 500px;
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.btn-save {
  width: 100%;
  background: var(--oat);
  color: var(--bg);
  border: none;
  font-family: 'VT323', monospace;
  font-size: 22px;
  letter-spacing: 4px;
  padding: 14px;
  cursor: pointer;
  text-decoration: none;
  display: block;
  text-align: center;
  transition: background 0.12s;
}

.btn-save:hover { background: #fff; }

.save-hint {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  letter-spacing: 1px;
  line-height: 1.6;
}

.divider {
  width: 100%;
  max-width: 500px;
  height: 1px;
  background: var(--border);
  margin: 28px 0 24px;
}

.footer-label {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 3px;
  text-align: center;
  text-transform: uppercase;
}

#error-msg {
  display: none;
  width: 100%;
  max-width: 500px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Courier New', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  text-align: center;
  line-height: 1.7;
}
</style>
</head>
<body>

<div class="header">
  <span class="wordmark">✦ JHALAK</span>
  <span class="tagline">your moment</span>
</div>

<div class="photo-frame" id="photo-frame">
  <div class="photo-placeholder" id="photo-placeholder">loading…</div>
</div>

<div class="actions" id="actions" style="display:none">
  <a class="btn-save" id="btn-save" href="#" download="jhalak-moment.jpg">SAVE TO PHOTOS</a>
  <p class="save-hint">
    on iPhone: tap &amp; hold the photo · "Save to Photos"<br>
    on Android: tap &amp; hold · "Download image"
  </p>
</div>

<div id="error-msg"></div>

<div class="divider"></div>
<p class="footer-label">simkaur.art · jhalak installation</p>

<script>
'use strict';

const params = new URLSearchParams(location.search);
const rawUrl = params.get('url') || '';

// Only load from known Vercel Blob domains
const isSafeUrl = /^https:\/\/[a-z0-9-]+\.public\.blob\.vercel-storage\.com\/jhalak\/.+\.jpg(\?.*)?$/.test(rawUrl);

const frame       = document.getElementById('photo-frame');
const placeholder = document.getElementById('photo-placeholder');
const actions     = document.getElementById('actions');
const btnSave     = document.getElementById('btn-save');
const errorMsg    = document.getElementById('error-msg');

if (!rawUrl || !isSafeUrl) {
  placeholder.style.display = 'none';
  errorMsg.style.display = 'block';
  errorMsg.textContent = rawUrl
    ? 'this link looks invalid. ask the gallery staff to scan again.'
    : 'no photo found. scan the QR code at the installation.';
} else {
  const img = document.createElement('img');
  img.alt = 'your JHALAK capture';

  img.onload = () => {
    placeholder.remove();
    frame.appendChild(img);
    actions.style.display = 'flex';
    btnSave.href = rawUrl;
  };

  img.onerror = () => {
    placeholder.style.display = 'none';
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'photo could not be loaded. it may have expired or been removed.';
  };

  img.src = rawUrl;
}
</script>
</body>
</html>
